{% extends 'base.html' %}

{% block content %}
<div class="auth-shell reveal">
  <div class="auth-panel auth-illustration">
    <div class="brand-mark brand-mark-inline" aria-label="Nuttraea">
      <span class="pixel-word">N</span><span class="pixel-word">u</span><span class="pixel-word">t</span><span class="pixel-word">t</span><span class="pixel-word">r</span>
      <span class="pixel-portrait" aria-hidden="true">
        <svg viewBox="0 0 12 12" role="img"><rect x="2" y="1" width="8" height="8" fill="#fff" stroke="#16771b" stroke-width="0.4" rx="1"/><rect x="3.5" y="2.2" width="1.5" height="1.5" fill="#f2c68b"/><rect x="7" y="2.2" width="1.5" height="1.5" fill="#f2c68b"/><rect x="4.2" y="3.8" width="3.6" height="2.2" fill="#f2c68b"/><rect x="4.8" y="4.2" width="0.7" height="0.7" fill="#2f2b2a"/><rect x="6.7" y="4.2" width="0.7" height="0.7" fill="#2f2b2a"/><rect x="5" y="5.2" width="2.2" height="0.5" fill="#6b4d2d"/><rect x="4.2" y="6.2" width="3.6" height="1.4" fill="#4a7533"/><rect x="3.8" y="7.6" width="4.4" height="0.8" fill="#2d4c1f"/></svg>
      </span>
      <span class="pixel-portrait" aria-hidden="true">
        <svg viewBox="0 0 12 12" role="img"><rect x="2" y="1" width="8" height="8" fill="#fff" stroke="#16771b" stroke-width="0.4" rx="1"/><rect x="3.2" y="2.2" width="5.6" height="2.2" fill="#3b2a23"/><rect x="3.8" y="2.9" width="1.2" height="1.2" fill="#f2c68b"/><rect x="5.8" y="2.9" width="1.2" height="1.2" fill="#f2c68b"/><rect x="4.4" y="4.2" width="3.2" height="2.1" fill="#4a2d1f"/><rect x="4.8" y="4.4" width="0.8" height="0.8" fill="#f1e1c0"/><rect x="6.2" y="4.4" width="0.8" height="0.8" fill="#f1e1c0"/><rect x="5.2" y="5.2" width="2.1" height="0.5" fill="#2e261f"/><rect x="4.4" y="6.4" width="3.2" height="1.2" fill="#4d6e2f"/></svg>
      </span>
      <span class="pixel-portrait" aria-hidden="true">
        <svg viewBox="0 0 12 12" role="img"><rect x="2" y="1" width="8" height="8" fill="#fff" stroke="#16771b" stroke-width="0.4" rx="1"/><rect x="3.2" y="2.2" width="5.6" height="2.2" fill="#b8673d"/><rect x="3.8" y="2.9" width="1.1" height="1.1" fill="#f2c68b"/><rect x="5.8" y="2.9" width="1.1" height="1.1" fill="#f2c68b"/><rect x="4.4" y="4.2" width="3.2" height="2.2" fill="#b8673d"/><rect x="4.8" y="4.4" width="0.8" height="0.8" fill="#f1e1c0"/><rect x="6.2" y="4.4" width="0.8" height="0.8" fill="#f1e1c0"/><rect x="5.2" y="5.2" width="2.1" height="0.5" fill="#8f3d31"/><rect x="4.4" y="6.4" width="3.2" height="1.2" fill="#4d6e2f"/></svg>
      </span>
    </div>
    <h3>Seu plano começa com um cadastro simples.</h3>
    <p>Conte com uma base visual profissional para criar a rotina que você deseja manter.</p>
  </div>

  <div class="auth-panel card">
    <p class="eyebrow">Cadastro</p>
    <h2>Criar conta</h2>
    <form method="post" class="modern-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Cadastrar</button>
    </form>
  </div>
</div>
{% endblock %}
