{% extends 'base.html' %}

{% block content %}
<div class="auth-shell reveal">
    <div class="auth-panel auth-illustration">
    <h3>Seu plano começa com um cadastro simples.</h3>
    <p>Conte com uma base visual profissional para criar a rotina que você deseja manter.</p>
  </div>

  <div class="auth-panel card">
    <p class="eyebrow">Cadastro</p>
    <h2>Criar conta</h2>
    <form method="post" class="modern-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Cadastrar</button>
    </form>
  </div>
</div>
{% endblock %}
