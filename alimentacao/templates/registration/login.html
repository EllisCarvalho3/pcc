{% extends 'base.html' %}

{% block content %}
<div class="auth-shell reveal">
  <div class="auth-panel auth-illustration">
    <h3>Bem-vindo de volta ao seu espaço de saúde.</h3>
    <p>Uma experiência mais organizada para acompanhar metas e rotina diária.</p>
  </div>

  <div class="auth-panel card">
    <p class="eyebrow">Acesso</p>
    <h2>Entrar</h2>
    <form method="post" class="modern-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
